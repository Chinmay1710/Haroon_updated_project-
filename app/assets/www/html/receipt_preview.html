<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Customer Receipt Print Preview</title>
 <link href="../css/fonts.css" rel="stylesheet"/>
 
 <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
 <style>
 /* 80mm POS receipt styling (Thermer style) */
 body {
 background-color: #f3f4f6;
 display: flex;
 justify-content: center;
 font-family: 'Arial', 'Helvetica', sans-serif;
 color: #000;
 margin: 0;
 padding: 20px;
 }
 .pos-receipt {
 width: 80mm; /* Standard 80mm paper size */
 max-width: 80mm;
 background: white;
 padding: 2mm;
 box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
 font-size: 15px; /* Larger font for readability */
 line-height: 1.3;
 box-sizing: border-box;
 color: black;
 font-weight: 500;
 }
 @media print {
 body { background: white; margin: 0; padding: 0; display: block; }
 .pos-receipt { width: 100%; max-width: 100%; box-shadow: none; margin: 0; padding: 0; }
 .no-print { display: none !important; }
 @page { margin: 0; size: 80mm auto; }
 }
 .text-center { text-align: center; }
 .text-right { text-align: right; }
 .font-bold { font-weight: bold; }
 .text-lg { font-size: 20px; font-weight: bold; letter-spacing: 0.5px; }
 .dashed-line { border-top: 2px dashed #000; margin: 8px 0; }
 .flex-between { display: flex; justify-content: space-between; align-items: flex-start; }
 .mb-2 { margin-bottom: 8px; }
 .mt-2 { margin-top: 8px; }
 /* Clean table for thermal */
 .receipt-table { width: 100%; margin: 8px 0; border-collapse: collapse; }
 .receipt-table th, .receipt-table td { padding: 4px 0; font-size: 14px; }
 .receipt-table th { text-align: left; font-weight: bold; border-bottom: 2px dashed #000; border-top: 2px dashed #000; }
 .receipt-table .text-right { text-align: right; }
 </style>
 <link rel="stylesheet" href="../css/compiled.css">
  <link rel="manifest" href="../manifest.json">
</head>
<body>
 <!-- Action Bar (Task-Focused screen, no global nav) -->
 <div class="fixed top-4 right-4 no-print flex gap-2">
 <button onclick="window.history.back()" class="px-4 py-2 bg-gray-200 rounded text-sm font-sans flex items-center gap-1">
 <span class="material-symbols-outlined" style="font-size:16px;">arrow_back</span> Back
 </button>
 <button onclick="window.savePdf()" class="px-4 py-2 bg-green-600 text-white rounded text-sm font-sans flex items-center gap-1">
 <span class="material-symbols-outlined" style="font-size:16px;">download</span> Save PDF
 </button>
 <button onclick="window.printReceipt()" class="px-4 py-2 bg-blue-600 text-white rounded text-sm font-sans flex items-center gap-1">
 <span class="material-symbols-outlined" style="font-size:16px;">print</span> Print
 </button>
 </div>

 <!-- Print Canvas (The 80mm representation) -->
 <main class="pos-receipt print-canvas">
 <div class="text-center mb-2 mt-2">
 <div class="font-bold text-lg"><span class="global-shop-name">Artisan Stitch</span></div>
 <div><span class="global-shop-address">123 Tailor Row</span></div>
 <div>Ph: <span class="global-shop-phone">(555) 019-8273</span></div>
 </div>
 
 <div class="dashed-line"></div>
 <div class="text-center font-bold mb-2">RECEIPT</div>
 
 <div class="flex-between">
 <span>Bill No:</span>
 <span id="rp-order-number" class="font-bold">...</span>
 </div>
 <div class="flex-between">
 <span>Date:</span>
 <span id="rp-date">...</span>
 </div>
 <div class="flex-between">
 <span>Delivery:</span>
 <span id="rp-delivery-date">...</span>
 </div>

 <div class="dashed-line"></div>
 
 <div class="mb-2">
 <div>Customer: <span id="rp-customer-name" class="font-bold">...</span></div>
 <div id="rp-customer-mobile"></div>
 </div>

 <div class="dashed-line"></div>
 
 <!-- Headers -->
 <div style="display:flex; font-weight:bold;">
 <div style="width: 50%;">Item</div>
 <div style="width: 15%; text-align:center;">Qty</div>
 <div style="width: 35%; text-align:right;">Total</div>
 </div>
 <div class="dashed-line"></div>
 
 <div id="rp-items-tbody">
 <!-- Items injected by JS -->
 </div>

 <div class="dashed-line"></div>
 
 <div class="flex-between font-bold" style="font-size:14px;">
 <span>TOTAL:</span>
 <span id="rp-total">0.00</span>
 </div>
 
 <div id="rp-paid-history" class="mt-2 text-sm" style="font-size: 11px;"></div>
 
 <div class="dashed-line"></div>
 <div class="flex-between font-bold" style="font-size: 14px;">
 <span>DUE:</span>
 <span id="rp-balance">0.00</span>
 </div>
 <div class="dashed-line"></div>
 
 <div class="text-center mt-2" style="font-size: 10px;">
 Thank you for your business!
 </div>

 </main>

 <script src="../js/api.js?v=1787472025"></script>
 <script src="../js/app.js?v=1787472025"></script>
 <script src="../js/receipt_preview.js?v=1787472025"></script>

<!-- Mobile Bottom Navigation -->
<nav id="mobile-bottom-nav" class="md:hidden fixed bottom-0 left-0 right-0 h-16 bg-surface shadow-[0_-4px_15px_rgba(0,0,0,0.1)] z-40 flex items-center justify-around px-2 border-t border-outline-variant/20">
    <a href="javascript:window.API.navigate('dashboard')" class="flex flex-col items-center gap-1 p-2 text-on-surface-variant hover:text-primary transition-colors">
        <span class="material-symbols-outlined text-[24px]">home</span>
        <span class="text-[10px] font-medium">Home</span>
    </a>
    <a href="javascript:window.API.navigate('orders_list')" class="flex flex-col items-center gap-1 p-2 text-on-surface-variant hover:text-primary transition-colors">
        <span class="material-symbols-outlined text-[24px]">receipt_long</span>
        <span class="text-[10px] font-medium">Orders</span>
    </a>
    <a href="javascript:window.API.navigate('customers_list')" class="flex flex-col items-center gap-1 p-2 text-on-surface-variant hover:text-primary transition-colors">
        <span class="material-symbols-outlined text-[24px]">group</span>
        <span class="text-[10px] font-medium">Customers</span>
    </a>
    <a href="javascript:window.API.navigate('payments')" class="flex flex-col items-center gap-1 p-2 text-on-surface-variant hover:text-primary transition-colors">
        <span class="material-symbols-outlined text-[24px]">payments</span>
        <span class="text-[10px] font-medium">Payments</span>
    </a>
    <button onclick="var sb=document.getElementById('sidebar'); var ov=document.getElementById('sidebar-overlay'); sb.classList.remove('-left-[290px]'); sb.classList.add('left-0'); ov.classList.remove('hidden');" class="flex flex-col items-center gap-1 p-2 text-on-surface-variant hover:text-primary transition-colors">
        <span class="material-symbols-outlined text-[24px]">menu</span>
        <span class="text-[10px] font-medium">More</span>
    </button>
</nav>

</body>
</html>
